
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="something.css">
    <title>Home Page</title>
    <style>
        body {
            font-family: 'Curry', sans-serif;
        }

        header {
            background-color: white;
            color: purple;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: purple;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <img src="left-image.jpg" alt="Left Image" style="float: left; width: 100px; height: auto;">
        <img src="middle-image.jpg" alt="Middle Image"
            style="display: block; margin: 0 auto; width: 100px; height: auto;">
        <img src="right-image.jpg" alt="Right Image" style="float: right; width: 100px; height: auto;">
    </header>
    <nav>
        <a href="#"><img src="home-icon.jpg" alt="Home" style="width: 50px; height: auto; margin: 0 10px;"></a>
        <a href="#"><img src="classes-icon.jpg" alt="Classes & Curriculum"
                style="width: 50px; height: auto; margin: 0 10px;"></a>
        <a href="#"><img src="development-icon.jpg" alt="Professional Development"
                style="width: 50px; height: auto; margin: 0 10px;"></a>
        <a href="#"><img src="testimonials-icon.jpg" alt="Testimonials"
                style="width: 50px; height: auto; margin: 0 10px;"></a>
        <a href="#"><img src="faq-icon.jpg" alt="FAQ" style="width: 50px; height: auto; margin: 0 10px;"></a>
    </nav>
    <style>
        nav {
            display: flex;
            justify-content: space-around;
        }
    </style>
</body>

</html>
