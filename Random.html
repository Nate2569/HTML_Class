<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .image-container {
            position: relative;
            width: 300px;
            /* Adjust this width to fit your design */
            height: 640px;
            /* Adjust this height to fit all images vertically with space */
            overflow: hidden;
        }

        .image-container img {
            position: absolute;
            left: 0;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .image-1 {
            top: 0;
        }

        .image-2 {
            top: 230px;
            /* Adjust this value to place the second image */
        }

        .image-3 {
            top: 460px;
            /* Adjust this value to place the third image */
        }
    </style>
    <title>Vertical Images with Space</title>
</head>

<body>
    <div class="image-container"> <img src="Class_1.JPEG" alt="Students in a classroom" class="image-1"> <img
            src="Class_2.JPEG" alt="Second image is also students in a classroom" class="image-2"> <img
            src="Class_3.JPEG" alt="Third image is also students in a classroom" class="image-3"> </div>
</body>
